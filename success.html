<!DOCTYPE html>
<html lang="de">
    <head>
        <meta http-equiv="content-type" content="text/html; charset=utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Nachricht erfolgreich gesendet - SchülerFokus" />
        <title>Vielen Dank! - Sch&uuml;lerFokus</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <!-- Font Awesome icons (free version)-->
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <!-- Simple line icons-->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/simple-line-icons/2.5.5/css/simple-line-icons.min.css" rel="stylesheet" />
        <!-- Google fonts-->
        <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,700,300italic,400italic,700italic" rel="stylesheet" type="text/css" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="css/styles.css" rel="stylesheet" />
        <style>
            .success-container {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            }
            .success-card {
                background: white;
                padding: 3rem;
                border-radius: 1rem;
                box-shadow: 0 10px 40px rgba(0,0,0,0.1);
                text-align: center;
                max-width: 500px;
            }
            .success-icon {
                font-size: 4rem;
                color: #28a745;
                margin-bottom: 1rem;
            }
            .success-title {
                font-size: 2rem;
                font-weight: bold;
                margin-bottom: 1rem;
                color: #333;
            }
            .success-message {
                font-size: 1.1rem;
                color: #666;
                margin-bottom: 2rem;
            }
            .btn-home {
                background-color: #667eea;
                border: none;
                padding: 0.75rem 2rem;
                font-size: 1rem;
                border-radius: 0.5rem;
                color: white;
                text-decoration: none;
                display: inline-block;
                transition: all 0.3s;
            }
            .btn-home:hover {
                background-color: #5568d3;
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
                color: white;
            }
        </style>
    </head>
    <body>
        <div class="success-container">
            <div class="success-card">
                <div class="success-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h1 class="success-title">Vielen Dank!</h1>
                <p class="success-message">
                    Deine Nachricht wurde erfolgreich gesendet. Ich werde mich so schnell wie möglich bei dir melden!
                </p>
                <a href="index.html" class="btn-home">
                    <i class="fas fa-home"></i> Zurück zur Startseite
                </a>
            </div>
        </div>
    </body>
</html>
